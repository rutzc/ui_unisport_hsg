<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Unisport St.Gallen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="header.js"></script>
    <style>
        @font-face {
            font-family: 'Theinhardt';
            src: url('https://www.unisg.ch/-/media/93b40b33e7394d96a0e3a8e4e9d241b6.woff2') format('woff2');
            font-weight: normal;
        }
        html, body {
            padding: 0 !important;
            margin: 0 !important;
            width: 100vw !important;
            overflow-x: hidden;
        }
        #hsg-header {
            margin: 0 !important;
            padding: 0 !important;
            border: none !important;
        }
        .login-banner {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 300px;
            object-fit: cover;
            display: block;
            margin: 0 !important;
            border: none !important;
            box-shadow: none !important;
        }
        .login-main {
            width: 100%;
            max-width: 420px;
            margin: -60px auto 0 auto;
            padding: 2.5rem 1.5rem 2.5rem 1.5rem;
            background: #083d26;
            border-radius: 2rem;
            box-shadow: 0 4px 24px rgba(1,68,33,0.10);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        @media (max-width: 640px) {
            .login-banner {
                height: 180px !important;
            }
            .login-main {
                max-width: 98vw;
                margin: -40px auto 0 auto;
                padding: 1.5rem 0.5rem 2rem 0.5rem;
                border-radius: 1.2rem;
            }
        }
    </style>
</head>
<body class="bg-white font-theinhardt min-h-screen flex flex-col">
    <header id="hsg-header" style="margin:0;padding:0;border:none;"></header>
    <img src="img/unisport.webp" alt="Unisport" class="login-banner" style="margin:0;padding:0;border:none;width:100vw;max-width:100vw;display:block;">
    <main class="login-main">
        <h2 class="mb-6 text-center font-extrabold text-2xl sm:text-3xl uppercase text-white">ANMELDEN</h2>
        <form id="loginForm" class="w-full flex flex-col space-y-4">
            <input type="email" id="email" placeholder="E-Mail" value="claudia.rutz@student.unisg.ch" class="w-full px-4 py-3 bg-white text-black placeholder:text-gray-500 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-[#009B4C] transition text-base">
            <div class="relative">
                <input type="password" id="password" placeholder="Passwort" value="Unisport-Lover-25!" class="w-full px-4 py-3 bg-white text-black placeholder:text-gray-500 border border-transparent rounded-lg focus:outline-none focus:ring-2 focus:ring-[#009B4C] transition pr-12 text-base">
                <button id="togglePassword" type="button" tabindex="-1" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 focus:outline-none">
                    <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 12C2.73 7.943 7.523 5 12 5c4.477 0 9.27 2.943 11 7-1.73 4.057-6.523 7-11 7-4.477 0-9.27-2.943-11-7z" />
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" />
                    </svg>
                </button>
            </div>
            <div class="flex items-center space-x-2 text-white text-sm font-medium">
                <input type="checkbox" id="stayLoggedIn" checked class="w-4 h-4 rounded border-white bg-transparent focus:ring-white">
                <label for="stayLoggedIn">Angemeldet bleiben</label>
            </div>
            <button type="submit" class="w-full bg-[#009B4C] text-white py-3 rounded-lg font-extrabold text-lg sm:text-xl uppercase text-center transition hover:bg-[#06501b]">Anmelden</button>
        </form>
        <button onclick="window.location.href='registrieren.html'" class="mt-4 text-[#009B4C] font-semibold text-base sm:text-lg underline">Registrieren</button>
        <hr class="w-full my-6 border-white/30">
        <button class="w-full border border-white text-white py-3 rounded-lg font-bold mb-3 flex items-center justify-center gap-2 hover:bg-[#06501b] transition">
            <span>SWITCHaai Anmelden</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3" /></svg>
        </button>
        <button class="w-full border border-white text-white py-3 rounded-lg font-bold hover:bg-[#06501b] transition">Extern</button>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.header.renderHeader();
            window.header.setLoggedOut();

            // Passwort Sichtbarkeit toggeln
            const passwordInput = document.getElementById('password');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const eyeIcon = document.getElementById('eyeIcon');
            
            // Setze initial das "unsichtbar"-Icon
            eyeIcon.innerHTML = `
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 12C2.73 7.943 7.523 5 12 5c4.477 0 9.27 2.943 11 7-1.73 4.057-6.523 7-11 7-4.477 0-9.27-2.943-11-7z" />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" />
            `;
            
            togglePasswordBtn.addEventListener('click', function(e) {
                e.preventDefault();
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    // Auge offen (sichtbar)
                    eyeIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 12C2.73 7.943 7.523 5 12 5c4.477 0 9.27 2.943 11 7-1.73 4.057-6.523 7-11 7-4.477 0-9.27-2.943-11-7z" />
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                    `;
                } else {
                    passwordInput.type = 'password';
                    // Auge durchgestrichen (unsichtbar)
                    eyeIcon.innerHTML = `
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 12C2.73 7.943 7.523 5 12 5c4.477 0 9.27 2.943 11 7-1.73 4.057-6.523 7-11 7-4.477 0-9.27-2.943-11-7z" />
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2" fill="none" />
                        <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="2" />
                    `;
                }
            });
            

            // Login-Formular: Weiterleitung zu dashboard.html beim Absenden
            document.getElementById('loginForm').onsubmit = function(e) {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                if (email && password) {
                    const user = {
                        email: email,
                        firstname: 'Claudia',
                        lastname: 'Rutz',
                        name: 'Claudia'
                    };
                    if (window.header && typeof window.header.setLoggedIn === 'function') {
                        window.header.setLoggedIn(user);
                    }
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Bitte E-Mail und Passwort eingeben.');
                }
            };
            });

    </script>
</body>
</html>
