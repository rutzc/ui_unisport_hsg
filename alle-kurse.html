    function toggleFilter(group, value, btn) {

        } else {
            tempFilters[group].splice(idx, 1);
            btn.classList.remove('selected');
        }
    }
    function toggleFilterModal() {
        const modal = document.getElementById('filterModal');
        if (!modal.classList.contains('active')) {
            // When opening modal, copy active filters to temporary filters
            tempFilters = JSON.parse(JSON.stringify(activeFilters));
            // Update button states
            Object.keys(tempFilters).forEach(group => {
                tempFilters[group].forEach(value => {
                    const btn = document.querySelector(`[data-group="${group}"][data-value="${value}"]`);
                    if (btn) btn.classList.add('selected');
                });
            });
            // Disable body scrolling
            document.body.style.overflow = 'hidden';
        } else {
            // Re-enable body scrolling
            document.body.style.overflow = '';
        }
        modal.classList.toggle('active');
    }
    function applyFilters() {
        // Copy temporary filters to active filters
        activeFilters = JSON.parse(JSON.stringify(tempFilters));
        renderCourseList();
        toggleFilterModal();
    }
    // --- Suche ---
    document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value.toLowerCase();
        renderCourseList();
    });
    // --- Favoriten-Funktion ---
    function toggleFavorite(title) {
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        const index = favorites.indexOf(title);
        if (index === -1) {
            favorites.push(title);
        } else {
            favorites.splice(index, 1);
        }
        localStorage.setItem('favorites', JSON.stringify(favorites));
        updateFavoriteButton(title);
    }
    function updateFavoriteButton(title) {
        const btn = document.getElementById(`favorite-${title}`);
        if (btn) {
            const favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
            if (favorites.includes(title)) {
                btn.classList.add('text-yellow-500');
            } else {
                btn.classList.remove('text-yellow-500');
            }
        }
    }
    // --- Kursliste Rendering ---
    function renderCourseList() {
        const list = document.getElementById('courseList');
        list.innerHTML = '';
        let filtered = courses.filter(c => c.title.toLowerCase().includes(searchQuery));
        
        // Apply all active filters
        if (activeFilters.tags.length) {
            filtered = filtered.filter(c => {
                if (!c.meta) return false;
                // Extract the day abbreviation from meta info (e.g., "MO" from "MO 18:00 - 19:30")
                const dayMatch = c.meta.match(/^([A-Z]{2})/);
                if (!dayMatch) return false;
                
                const courseDayAbbr = dayMatch[1];
                // Map course day abbreviations to filter day abbreviations
                const dayMapping = {
                    'MO': 'Mo',
                    'DI': 'Di',
                    'MI': 'Mi',
                    'DO': 'Do',
                    'FR': 'Fr',
                    'SA': 'Sa',
                    'SO': 'So'
                };
                
                // Check if any of the selected day filters match this course's day
                return activeFilters.tags.some(tag => tag === dayMapping[courseDayAbbr]);
            });
        }
        if (activeFilters.orts.length) {
            filtered = filtered.filter(c => activeFilters.orts.includes(c.ort));
        }
        if (activeFilters.sportarts.length) {
            filtered = filtered.filter(c => activeFilters.sportarts.includes(c.sportart));
        }
        if (activeFilters.niveaus.length) {
            filtered = filtered.filter(c => activeFilters.niveaus.includes(c.niveau));
        }
        if (activeFilters.tageszeitens.length) {
            // Filter courses by time of day based on meta info (e.g., "MO 18:00 - 19:30")
            filtered = filtered.filter(c => {
                if (!c.meta) return false;
                
                // Extract time from meta info
                const timeMatch = c.meta.match(/\d{2}:\d{2}/);
                if (!timeMatch) return false;
                
                const hour = parseInt(timeMatch[0].split(':')[0]);
                
                // Check which time of day category this falls into
                let timeCategory = '';
                if (hour >= 8 && hour < 12) timeCategory = 'Morgen (8-12)';
                else if (hour >= 12 && hour < 14) timeCategory = 'Mittag (12-14)';
                else if (hour >= 14 && hour < 18) timeCategory = 'Nachmittag (14-18)';
                else if (hour >= 18 && hour < 22) timeCategory = 'Abend (18-22)';
                
                return activeFilters.tageszeitens.includes(timeCategory);
            });
        }
        if (activeFilters.kostens.length) {
            filtered = filtered.filter(c => activeFilters.kostens.includes(c.kosten));
        }
        if (activeFilters.status.length) {
            filtered = filtered.filter(c => {
                if (!c.badge) return false;
                
                if (activeFilters.status.includes('Freie Plätze') && c.badge.includes('Plätze frei')) {
                    return true;
                }
                
                if (activeFilters.status.includes('Warteliste') && c.badge.includes('Warteliste')) {
                    return true;
                }
                
                return false;
            });
        }

        // Gruppierung nach Buchstabe
        let grouped = {};
        filtered.forEach(c => {
            if (!grouped[c.letter]) grouped[c.letter] = [];
            grouped[c.letter].push(c);
        });
        Object.keys(grouped).sort().forEach(letter => {
            const label = document.createElement('div');
            label.className = 'hsg-list-label';
            label.textContent = letter;
            list.appendChild(label);
            grouped[letter].forEach(course => {
                const item = document.createElement('div');
                item.className = 'hsg-list-item' + (openCourse === course.title ? ' active' : '');
                item.innerHTML = `<span>${course.title}</span>
                    <div class='toggle-icon ${openCourse === course.title ? 'active' : ''}'>
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>`;
                item.onclick = () => {
                    openCourse = openCourse === course.title ? null : course.title;
                    renderCourseList();
                };
                list.appendChild(item);
                if (openCourse === course.title) {
                    const detail = document.createElement('div');
                    detail.className = 'hsg-course-detail';
                    detail.innerHTML = `
                        ${course.img ? `<img src='${course.img}' alt='${course.title}' class='hsg-course-img'>` : ''}
                        <div class='hsg-course-content'>
                            <div class='hsg-course-title'>${course.title}${course.badge ? `<span class='hsg-badge'>${course.badge}</span>` : ''}</div>
                            ${course.desc ? `<div class='hsg-course-desc'>${course.desc}</div>` : ''}
                            
                            <!-- Important Course Info Grid (always visible) -->
                            <div class="hsg-course-info-grid">
                                <div class="hsg-course-info-item">
                                    <div class="hsg-course-info-label">Zeit</div>
                                    <div class="hsg-course-info-value">${course.meta ? course.meta.replace(/^[A-Z]{2} /, '') : 'N/A'}</div>
                                </div>
                                <div class="hsg-course-info-item">
                                    <div class="hsg-course-info-label">Ort</div>
                                    <div class="hsg-course-info-value">${course.details || 'N/A'}</div>
                                </div>
                                <div class="hsg-course-info-item">
                                    <div class="hsg-course-info-label">Kosten</div>
                                    <div class="hsg-course-info-value">${course.kosten || 'N/A'}</div>
                                </div>
                                <div class="hsg-course-info-item">
                                    <div class="hsg-course-info-label">Anbieter</div>
                                    <div class="hsg-course-info-value">Unisport</div>
                                </div>
                            </div>

                            <!-- Booking Button and Share Toggle (always visible) -->
                            <div class="hsg-book-section">
                                <button class='hsg-btn hsg-btn-book ${isAlreadyBooked(course.title) ? "booked" : ""}' onclick="${isAlreadyBooked(course.title) ? 'event.stopPropagation()' : `openBookingModal('${course.title}','${course.meta}','${course.details}',false);event.stopPropagation();`}">${isAlreadyBooked(course.title) ? 'Gebucht' : 'Buchen'}</button>
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="hsg-star w-10 h-10 border-2 border-hsg-green rounded-lg p-1 text-gray-400" onclick="toggleFavorite('${course.title}');event.stopPropagation();" id="favorite-${course.title}">
                                    <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" clip-rule="evenodd" />
                                </svg>
                            </div>
                            </div>
                            <!-- Accordion Sections -->
                            <div class="hsg-accordion" data-accordion="info-${course.title}">
                                <div class="hsg-accordion-header" onclick="toggleAccordion('info-${course.title}')">
                                    <span>Allgemeine Informationen</span>
                                    <div class="toggle-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </div>
                                </div>
                                <div class="hsg-accordion-content" id="accordion-info-${course.title}">
                                    <p>Dieser Kurs wird von Unisport St. Gallen angeboten. Das Niveau ist ${course.niveau}.</p>
                                    <p>Bitte bringen Sie geeignete Sportkleidung und ggf. eine Wasserflasche mit.</p>
                                </div>
                            </div>
                            
                            <div class="hsg-accordion" data-accordion="contact-${course.title}">
                                <div class="hsg-accordion-header" onclick="toggleAccordion('contact-${course.title}')">
                                    <span>Kontakt</span>
                                    <div class="toggle-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </div>
                                </div>
                                <div class="hsg-accordion-content" id="accordion-contact-${course.title}">
                                    <p><strong>Kursleitung:</strong> Max Mustermann</p>
                                    <p><strong>E-Mail:</strong> kurse@unisport.ch</p>
                                    <p><strong>Telefon:</strong> +41 71 123 45 67</p>
                                </div>
                            </div>
                            
                            <div class="hsg-accordion" data-accordion="faq-${course.title}">
                                <div class="hsg-accordion-header" onclick="toggleAccordion('faq-${course.title}')">
                                    <span>FAQs</span>
                                    <div class="toggle-icon">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
                                            <polyline points="6 9 12 15 18 9"></polyline>
                                        </svg>
                                    </div>
                                </div>
                                <div class="hsg-accordion-content" id="accordion-faq-${course.title}">
                                    <p><strong>Kann ich auch als Anfänger teilnehmen?</strong><br>
                                    Ja, dieser Kurs ist für ${course.niveau === 'Beginner' ? 'Anfänger geeignet' : course.niveau === 'Erfahren' ? 'Personen mit Vorkenntnissen geeignet' : 'fortgeschrittene Teilnehmer konzipiert'}.</p>
                                    
                                    <p><strong>Was passiert bei Krankheit?</strong><br>
                                    Bei Krankheit können Sie sich bis 24 Stunden vor Kursbeginn abmelden.</p>
                                </div>
                            </div>
                        </div>
                    `;
                    list.appendChild(detail);
                    updateFavoriteButton(course.title);
                    
                    // Teilnehmerliste laden
                    setTimeout(() => {
                        const participantsList = document.getElementById(`participants-list-${course.title}`);
                        if (participantsList) {
                            const enrolledPeople = courseEnrollments[course.title] || [];
                            if (enrolledPeople.length > 0) {
                                participantsList.innerHTML = `
                                    <ul class="text-sm text-gray-600 space-y-1">
                                        ${enrolledPeople.map(name => `<li>• ${name}</li>`).join('')}
                                    </ul>
                                `;
                            } else {
                                participantsList.innerHTML = `<p class="text-sm text-gray-500">Noch keine Teilnehmer oder Teilnehmerinformationen werden nicht geteilt.</p>`;
                            }
                        }
                    }, 500);
                }
            });
        });
    }
    // --- Filter-Init ---
    renderFilterGroup('tags', 'Tag', filterData.tags);
    renderFilterGroup('orts', 'Ort', filterData.orts);
    renderFilterGroup('sportarts', 'Sportart', filterData.sportarts);
    renderFilterGroup('niveaus', 'Niveau', filterData.niveaus);
    renderFilterGroup('tageszeitens', 'Tageszeit', filterData.tageszeitens);
    renderFilterGroup('kostens', 'Kosten', filterData.kostens);
    renderFilterGroup('status', 'Status', filterData.status);
    
    // Check if a course is already booked
    function isAlreadyBooked(courseTitle) {
        const anmeldungen = JSON.parse(localStorage.getItem('anmeldungen') || '[]');
        return anmeldungen.some(anmeldung => anmeldung.title === courseTitle);
    }
    
    renderCourseList();
    // --- Modal für Buchung (wie heute-morgen) ---
    function openBookingModal(title, time, status, isWaitlist) {
        // Check if already booked
        if (isAlreadyBooked(title)) {
            return; // Don't open modal if already booked
        }
        
        if (!document.getElementById('bookingModal')) {
            const modal = document.createElement('div');
            modal.id = 'bookingModal';
            modal.className = 'fixed inset-0 bg-black bg-opacity-40 z-50 flex items-center justify-center';
            modal.innerHTML = `
                <div class="bg-white rounded-xl shadow-lg max-w-md w-full mx-4 overflow-hidden">
                    <div class="p-6">
                        <h3 class="text-lg font-semibold text-hsg-gray mb-2" id="modalTitle">${title}</h3>
                        <div id="modalContent" class="space-y-4">
                            <div id="bookingView">
                                <p class="text-sm text-gray-600 mb-4" id="modalText">Möchtest du diesen Kurs verbindlich buchen?</p>
                                <div class="text-sm text-gray-600 space-y-2 mb-4">
                                    <div id="modalMeta"><span class='font-semibold'>Zeit:</span> ${time}<br><span class='font-semibold'>Ort:</span> ${status}</div>
                                </div>
                                
                                <div class="mb-4">
                                    <div class="text-sm text-gray-600 mb-2">
                                        <span class='font-semibold'>Bereits eingeschrieben:</span>
                                    </div>
                                    <div class="bg-gray-50 rounded-lg p-3">
                                        <ul class="text-sm text-gray-600 space-y-1" id="enrolledPeopleList"></ul>
                                        <div class="text-sm text-gray-500 cursor-pointer mt-1 hidden" id="showMoreEnrolled" onclick="toggleShowMoreEnrolled()">
                                            Mehr anzeigen...
                                        </div>
                                    </div>
                                </div>
                                <div class="flex space-x-3">
                                    <button id="confirmBooking" class="flex-1 bg-hsg-green text-white px-4 py-2 rounded font-medium hover:bg-green-700 transition">Bestätigen</button>
                                    <button onclick="closeModal()" class="flex-1 border border-gray-300 px-4 py-2 rounded font-medium hover:bg-gray-50 transition">Abbrechen</button>
                                </div>
                            </div>
                            <div id="successView" class="hidden text-center py-8">
                                <div class="mb-4">
                                    <svg class="mx-auto h-12 w-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </div>
                                <h4 class="text-lg font-semibold text-hsg-gray mb-2">Erfolgreich!</h4>
                                <p class="text-sm text-gray-600 mb-4" id="successMsg">Der Kurs wurde erfolgreich gebucht.</p>
                                <button onclick="closeModal()" class="bg-hsg-green text-white px-6 py-2 rounded font-medium hover:bg-green-700 transition">Schließen</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            modal.addEventListener('click', function(e) { if (e.target === modal) closeModal(); });
            document.getElementById('confirmBooking').onclick = function() {
                document.getElementById('bookingView').classList.add('hidden');
                document.getElementById('successView').classList.remove('hidden');
                let successMessage = 'Der Kurs wurde erfolgreich gebucht.';
                document.getElementById('successMsg').textContent = successMessage;
                
                // Kurs zum Dashboard hinzufügen
                const kursInfo = {
                    title: title,
                    time: time,
                    status: isWaitlist ? 'waitlist' : 'confirmed'
                };
                
                // Bestehende Anmeldungen aus localStorage holen oder neues Array erstellen
                let anmeldungen = JSON.parse(localStorage.getItem('anmeldungen') || '[]');
                
                // Prüfen, ob der Kurs bereits gebucht ist
                const existingIndex = anmeldungen.findIndex(a => a.title === title);
                if (existingIndex >= 0) {
                    // Kurs aktualisieren falls er bereits existiert
                    anmeldungen[existingIndex] = kursInfo;
                } else {
                    // Neuen Kurs hinzufügen
                    anmeldungen.push(kursInfo);
                }
                
                // Anmeldungen im localStorage speichern
                localStorage.setItem('anmeldungen', JSON.stringify(anmeldungen));
                
                // Re-render the course list to update the button
                renderCourseList();
            };
        } else {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalMeta').innerHTML = `<span class='font-semibold'>Zeit:</span> ${time}<br><span class='font-semibold'>Ort:</span> ${status}`;
            document.getElementById('successView').classList.add('hidden');
            document.getElementById('bookingView').classList.remove('hidden');
            document.getElementById('bookingModal').classList.remove('hidden');
            
            // Find the enrolledPeopleList container section
            const enrolledSection = document.getElementById('enrolledPeopleList').closest('.mb-4');
            
            // Teilnehmerliste für den aktuellen Kurs abrufen
            const enrolledPeople = courseEnrollments[title] || [];
            
            if (enrolledPeople.length > 0) {
                // Erste 3 Namen immer anzeigen, oder alle wenn weniger als 3
                const visibleNames = enrolledPeople.slice(0, 3);
                const hiddenNames = enrolledPeople.slice(3);
                
                // Alle sichtbaren Namen als Liste anzeigen
                document.getElementById('enrolledPeopleList').innerHTML = visibleNames.map(name => `<li>• ${name}</li>`).join('');
            }
        }
    }
    
    // Funktion zum Schließen des Modals
    function closeModal() {
        const modal = document.getElementById('bookingModal');
        if (modal) {
            modal.classList.add('hidden');
        }
    }
    
    // Funktion zum Umschalten der Accordion-Sektionen
    function toggleAccordion(id) {
        const content = document.getElementById('accordion-' + id);
        const header = document.querySelector(`[data-accordion="${id}"] .hsg-accordion-header`);
        const icon = header.querySelector('.toggle-icon');
        
        if (content.classList.contains('active')) {
            content.classList.remove('active');
            icon.classList.remove('active');
        } else {
            content.classList.add('active');
            icon.classList.add('active');
        }
    }
    </script>
</body>
</html>
