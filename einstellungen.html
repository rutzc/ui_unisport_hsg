

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Einstellungen | Unisport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .toggle {
      position: relative;
      width: 48px;
      height: 24px;
      appearance: none;
      background: #e5e5e5;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 9999px;
      transition: transform 0.3s;
    }
    .toggle:checked {
      background: #134e28;
    }
    .toggle:checked::before {
      transform: translateX(24px);
    }
  </style>
</head>
<body class="bg-white font-sans text-gray-900">
  <main class="max-w-md mx-auto px-4 py-10">
    <h2 class="text-gray-400 font-semibold text-sm mb-6">Account Settings</h2>
    <div class="space-y-6">
      <div class="flex items-center justify-between">
        <span class="text-lg">Edit profile</span>
        <a href="profil.html">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </a>
      </div>
      <div class="flex items-center justify-between">
        <span class="text-lg">Push notifications</span>
        <input type="checkbox" class="toggle" checked />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-lg">Dark mode</span>
        <input type="checkbox" class="toggle" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-lg">Informationen mit anderen teilen</span>
        <input type="checkbox" class="toggle" />
      </div>
    </div>
  </main>
</body>
</html>
