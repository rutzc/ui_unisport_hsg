

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Einstellungen | Unisport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .toggle {
      position: relative;
      width: 48px;
      height: 24px;
      appearance: none;
      background: #e5e5e5;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .toggle::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 9999px;
      transition: transform 0.3s;
    }
    .toggle:checked {
      background: #134e28;
    }
    .toggle:checked::before {
      transform: translateX(24px);
    }
  </style>
</head>
<body class="relative">
  <div class="absolute right-0 top-0 h-full flex justify-end">
    <div class="w-full max-w-md h-full bg-white shadow-xl p-6 relative overflow-y-auto">
      <!-- Close button -->
      <button onclick="window.location.href='dashboard.html'" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 text-2xl font-semibold">&times;</button>
      
      <h2 class="text-gray-400 font-semibold text-sm mb-6 mt-2">Account Settings</h2>
      <div class="space-y-6">
        <div class="flex items-center justify-between">
          <span class="text-lg">Edit profile</span>
          <a href="profil.html">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
            </svg>
          </a>
        </div>
        <div class="flex items-center justify-between">
          <span class="text-lg">Push notifications</span>
          <input type="checkbox" class="toggle" id="pushToggle" checked />
        </div>
        <div class="flex items-center justify-between">
          <span class="text-lg">Dark mode</span>
          <input type="checkbox" class="toggle" id="darkModeToggle" />
        </div>
        <div class="flex items-center justify-between">
          <span class="text-lg">Informationen über Kursanmeldung mit Anderen teilen</span>
          <input type="checkbox" class="toggle" id="shareToggle" />
        </div>
      </div>

      <!-- Save button -->
      <div class="mt-10">
        <button onclick="saveSettings()" class="w-full bg-hsg-green text-white py-2 px-4 rounded hover:bg-green-800 font-semibold">Speichern</button>
      </div>
    </div>
  </div>

  <script>
    function saveSettings() {
      const push = document.getElementById('pushToggle').checked;
      const dark = document.getElementById('darkModeToggle').checked;
      const share = document.getElementById('shareToggle').checked;
      localStorage.setItem('settings', JSON.stringify({ push, dark, share }));
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
