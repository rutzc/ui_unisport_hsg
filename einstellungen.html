<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Einstellungen | Unisport</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .toggle {
      position: relative;
      width: 48px;
      height: 24px;
      appearance: none;
      background: #e5e5e5;
      border-radius: 9999px;
      cursor: pointer;
      transition: background 0.3s;
      min-width: 48px;
    }
    .toggle::before {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 9999px;
      transition: transform 0.3s;
    }
    .toggle:checked {
      background: #134e28;
    }
    .toggle:checked::before {
      transform: translateX(24px);
    }
    
    /* Custom styles for button */
    .btn-confirm {
        background-color: #134e28; /* HSG green */
        color: white;
        font-weight: bold;
        padding: 0.75rem 1rem;
        border-radius: 0.5rem;
        width: 100%;
        transition: background-color 0.3s;
    }
    
    .btn-confirm:hover {
        background-color: #0d3b1d; /* Slightly darker green on hover */
    }
  </style>
</head>
<body class="bg-white font-sans text-gray-900">
  <main class="max-w-xl mx-auto px-4 py-10">
    <!-- Close button -->
    <button onclick="window.location.href='dashboard.html'" class="text-gray-500 hover:text-gray-800 text-2xl font-semibold mb-6 float-right">&times;</button>
    
    <!-- Profile Section -->
    <div class="flex items-center space-x-4 mb-8">
      <div class="w-16 h-16 rounded-full bg-gray-200 overflow-hidden">
        <img src="img/profile-photo.jpeg" alt="Profile Picture" class="w-full h-full object-cover">
      </div>
      <div>
        <h1 class="text-xl font-semibold">Claudia Rutz</h1>
        <p class="text-gray-500">claudia.rutz@unisg.ch</p>
      </div>
    </div>

    <h2 class="text-gray-400 font-semibold text-sm mb-6 mt-2">Account Settings</h2>
    <div class="space-y-6">
      <div class="flex items-center justify-between">
        <span class="text-lg">Push notifications</span>
        <input type="checkbox" class="toggle" id="pushToggle" checked />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-lg">Dark mode</span>
        <input type="checkbox" class="toggle" id="darkModeToggle" />
      </div>
      <div class="flex items-center justify-between">
        <span class="text-lg">Informationen über Kursanmeldung mit Anderen teilen</span>
        <input type="checkbox" class="toggle" id="shareToggle" />
      </div>
    </div>

    <!-- Save button direkt unter die Optionen -->
    <div class="mt-12">
      <button onclick="saveSettings()" class="btn-confirm">Speichern</button>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Load saved settings if available
      try {
        const savedSettings = JSON.parse(localStorage.getItem('settings')) || {};
        if (savedSettings.push !== undefined) document.getElementById('pushToggle').checked = savedSettings.push;
        if (savedSettings.dark !== undefined) document.getElementById('darkModeToggle').checked = savedSettings.dark;
        if (savedSettings.share !== undefined) document.getElementById('shareToggle').checked = savedSettings.share;
      } catch (e) {
        console.error('Error loading settings:', e);
      }
      
      // Load user data
      if (window.header && window.header.getUser) {
        const user = window.header.getUser();
        if (user) {
          const nameElem = document.querySelector('.text-xl.font-semibold');
          const emailElem = document.querySelector('.text-gray-500');
          
          if (nameElem && user.firstname && user.lastname) {
            nameElem.textContent = user.firstname + ' ' + user.lastname;
          }
          
          if (emailElem && user.email) {
            emailElem.textContent = user.email;
          }
        }
      }
      
      // Load profile picture
      const profileImg = document.querySelector('.w-16.h-16 img');
      const imgData = localStorage.getItem('profilePic');
      if (profileImg) {
        if (imgData) {
          profileImg.src = imgData;
        }
      }
    });

    function saveSettings() {
      const push = document.getElementById('pushToggle').checked;
      const dark = document.getElementById('darkModeToggle').checked;
      const share = document.getElementById('shareToggle').checked;
      localStorage.setItem('settings', JSON.stringify({ push, dark, share }));
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
