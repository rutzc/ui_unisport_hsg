<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil | Unisport St.Gallen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="header.js"></script>
    <style>
        @font-face {
            font-family: 'Theinhardt';
            src: url('https://www.unisg.ch/-/media/93b40b33e7394d96a0e3a8e4e9d241b6.woff2') format('woff2');
            font-weight: normal;
        }
        
        /* Custom styles for button */
        .btn-confirm {
            background-color: #134e28; /* HSG green */
            color: white;
            font-weight: bold;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            width: 100%;
            transition: background-color 0.3s;
        }
        
        .btn-confirm:hover {
            background-color: #0d3b1d; /* Slightly darker green on hover */
        }
    </style>
</head>
<body class="bg-white font-theinhardt min-h-screen">
    <main class="max-w-md mx-auto px-4 py-8">
        <!-- Close button -->
        <button onclick="window.location.href='dashboard.html'" class="text-gray-500 hover:text-gray-800 text-xl font-semibold mb-4 float-right">&times;</button>
        
        <!-- Profile Section Header (similar to einstellungen.html) -->
        <div class="flex items-center space-x-4 mb-6">
            <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gray-200 overflow-hidden relative group">
                <img id="headerProfilePic" src="img/profile-photo.jpeg" alt="Profile Picture" class="w-full h-full object-cover cursor-pointer group-hover:opacity-80 transition">
                <input type="file" id="profilePicInput" accept="image/*" class="hidden">
                <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                    <span class="hidden group-hover:block bg-green-700 text-white text-xs px-2 py-1 rounded">Bild ändern</span>
                </div>
            </div>
            <div>
                <h1 id="headerProfileName" class="text-lg font-semibold">Claudia Rutz</h1>
                <p id="headerProfileEmail" class="text-sm text-gray-500">claudia.rutz@student.unisg.ch</p>
            </div>
        </div>

        <h2 class="text-gray-400 font-semibold text-xs mb-5 mt-2">Edit profile</h2>

        <!-- Profile Edit Form -->
        <form id="profileForm" class="space-y-5">
            <!-- Name Field -->
            <div>
                <label for="name" class="block text-lg font-bold mb-1.5">Name</label>
                <input type="text" id="name" name="name" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base" value="Claudia Rutz">
            </div>
            
            <!-- Email Field -->
            <div>
                <label for="email" class="block text-lg font-bold mb-1.5">Email</label>
                <input type="email" id="email" name="email" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base" value="claudia.rutz@student.unisg.ch">
            </div>
            
            <!-- Password Field -->
            <div>
                <label for="password" class="block text-lg font-bold mb-1.5">Password</label>
                <input type="password" id="password" name="password" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base" value="************">
            </div>
            
            <!-- Date of Birth Field -->
            <div>
                <label for="dob" class="block text-lg font-bold mb-1.5">Date of Birth</label>
                <div class="relative">
                    <input type="text" id="dob" name="dob" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-base" value="23/05/2001">
                    <div class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </div>
                </div>
            </div>
            
            <!-- Bestätigen Button with maximum spacing -->
            <div class="mt-32">
                <button type="submit" class="btn-confirm">Bestätigen</button>
            </div>
        </form>
    </main>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            window.header.renderHeader();
            // Benutzerinformationen abrufen, ohne Weiterleitung zu login.html
            const user = window.header.getUser && window.header.getUser();
            
            // Header-Informationen anzeigen
            const headerName = document.getElementById('headerProfileName');
            const headerEmail = document.getElementById('headerProfileEmail');
            
            // Set default values for Claudia Rutz
            if (headerName) headerName.textContent = "Claudia Rutz";
            if (headerEmail) headerEmail.textContent = "claudia.rutz@student.unisg.ch";
            
            // Use user data if available
            if (user) {
                // Header-Informationen
                if (headerName && user.firstname && user.lastname) {
                    headerName.textContent = user.firstname + ' ' + user.lastname;
                }
                if (headerEmail && user.email) {
                    headerEmail.textContent = user.email;
                }
                
                // Formular-Werte
                const nameInput = document.getElementById('name');
                const emailInput = document.getElementById('email');
                
                if (nameInput && user.firstname && user.lastname) {
                    nameInput.value = user.firstname + ' ' + user.lastname;
                }
                
                if (emailInput && user.email) {
                    emailInput.value = user.email;
                }
            }
            
            // Profilbild laden
            const imgData = localStorage.getItem('profilePic');
            const headerPic = document.getElementById('headerProfilePic');
            
            if (imgData) {
                if (headerPic) headerPic.src = imgData;
            } else {
                const defaultImg = 'img/profile-photo.jpeg';
                if (headerPic) headerPic.src = defaultImg;
            }
            
            // Profile picture upload functionality
            const pic = document.getElementById('headerProfilePic');
            const input = document.getElementById('profilePicInput');
            if (pic && input) {
                pic.addEventListener('click', function(e) {
                    e.preventDefault();
                    input.click();
                });
                input.addEventListener('change', function() {
                    if (input.files && input.files[0]) {
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            localStorage.setItem('profilePic', e.target.result);
                            headerPic.src = e.target.result;
                        };
                        reader.readAsDataURL(input.files[0]);
                    }
                });
            }
            
            // Formular-Handler
            document.getElementById('profileForm').addEventListener('submit', function(e) {
                e.preventDefault();
                // Hier könnte die Logik zum Speichern der Profilinformationen eingefügt werden
                
                // Direkt zurück zum Dashboard ohne Popup
                window.location.href = 'dashboard.html';
            });
        });
    </script>
</body>
</html>
